name: taf_ias_academy
description: TAF IAS Academy - Course Management System (Flutter app for admin, staff and students).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  intl: '>=0.19.0 <1.0.0'
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png